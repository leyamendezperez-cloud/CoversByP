<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de adminstración</title>
  <!-- Open Graph -->
  <meta property="og:title" content="CoversByP">
  <meta property="og:description"
    content="Busca por modelo y obtén disponibilidad inmediata, ubicación y alternativas compatibles de los covers existentes en la tienda Benavides y Pérez">
  <meta property="og:image"
    content="https://github.com/leyamendezperez-cloud/ByP/blob/master/public/Multimedia/logo_byo.webp">

  <!-- SEO -->
  <meta name="description" content="Encuentra el cover perfecto para una gran variedad de teléfonos. ">
  <meta name="keywords" content="Benavides y Pérez, buscador de covers, covers Cabaiguán">
  <meta name="author" content="Leya Méndez">

  <!-- Robots -->
  <meta name="robots" content="index, follow">

  <!-- Tema de la barra del nav -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta charset="UTF-8">

  <link rel="manifest" href="/manifest.json">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=mobile_2" />
  <link rel="stylesheet" href="css/admin.css">

  <script type="importmap">
  {
    "imports": {
      "sqlocal": "https://cdn.jsdelivr.net/npm/sqlocal@0.8.0/dist/index.js"
    }
  }
</script>

</head>

<body>

  <header>
    <div class="header__text-container">
      <h2 class="header__tittle">CoverFinder</h2>
      <h1 class="header__subtittle">Panel de administración</h1>
    </div>
    <button id="logoutBtn" class="header__btn">
      <i class="ri-logout-box-r-line"></i>
      Cerrar sesión</button>
  </header>


  <!-- Formulario para crear/editar -->
  <section class="add-marca">
    <div class="add-marca__text-container">
      <i class="ri-smartphone-line"></i>
      <div>
        <h2 id="formTitle">Nueva Marca</h2>
        <h3 class="add-marca__subtittle">Registra una nueva marca</h3>
      </div>
    </div>

    <form id="marcaForm" aria-label="Formulario para añadir una nueva marca de cover">
      <input type="hidden" id="editId">
      <label class="form__label-name">Nombre de la marca <input type="text" id="nombre"
          placeholder="Ej: Samsung Galaxy A15"></label>
      <label class="form__label-box">Caja <input type="number" id="caja" required placeholder="Ej:2"></label>
      <label class="form__label-stock">Stock <input type="number" id="stock" required placeholder="Ej: 23"></label>
      <label class="form__label-similar">Semejantes <span>(separados por coma):</span>
        <input type="text" id="semejantes" placeholder="Redmi Note 12, Samsung Galaxy A15, ...">
      </label>
      <button type="button" id="cancelEditBtn" style="display: none;">Cancelar</button>
      <button type="submit" id="saveBtn"><i class="ri-save-line"></i>Guardar </button>
    </form>
  </section>

  <!-- Tabla de marcas -->
  <main class="tabla-marcas-container">
    <div class="add-marca__text-container">
      <i class="ri-smartphone-line"></i>
      <div>
        <h2 id="formTitle" style="font-size: 1.4rem;">Marcas Registradas</h2>
        <h3 class="add-marca__subtittle">Gestiona las marcas registradas</h3>
      </div>
    </div>

    <table id="tablaMarcas" aria-label="Tabla de las marcas registradas">
      <thead>
        <tr>
          <th>Marca</th>
          <th>Caja</th>
          <th>Stock</th>
          <th>Semejantes</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaBody"></tbody>
    </table>
  </main>


  <!-- Script de inicialización (mínimo) -->
  <script type="module">
    import { inicializarPanel } from "./js/ui.js";
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registrado en admin'))
          .catch(err => console.log('Error SW admin:', err));
      });
    }
    inicializarPanel();
  </script>
</body>

</html>
